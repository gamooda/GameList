<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<style>
/* Кастомный скроллбар */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}
::-webkit-scrollbar-track {
    background: var(--bg);
}
::-webkit-scrollbar-thumb {
    background: #333338;
    border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
    background: #4a4a50;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
}
:root {
    --bg: #0f0f13;
    --panel: #18181f;
    --border: #27272e;
    --border-light: #3f3f4a;
    --text: #f0f0f5;
    --text-muted: #9a9aad;
    --primary: #7c3aed;
    --primary-grad: linear-gradient(135deg, #8b5cf6, #6d28d9);
    --primary-hover: #6d28d9;
    --danger: #ef4444;
    --success: #10b981;
}
body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
}
.app {
    max-width: 900px;
    width: 100%;
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
}
h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
}
.share-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
    justify-content: flex-end;
}
.share-bar input {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-light);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    flex: 1;
    min-width: 200px;
    max-width: 400px;
    outline: none;
    transition: border-color 0.2s;
}
.share-bar input:focus {
    border-color: var(--primary);
}
.btn {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border-light);
    background: var(--panel);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.btn:hover {
    background: #23232b;
    border-color: #555;
    color: var(--text);
}
.btn-primary {
    background: var(--primary-grad);
    border: none;
    color: #fff;
    box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
}
.btn-primary:hover {
    filter: brightness(1.1);
    color: #fff;
}
.btn-success {
    background: var(--success);
    border: none;
    color: #fff;
}
.btn-success:hover {
    background: #059669;
}
.search-section {
    position: relative;
    margin-bottom: 24px;
}
.search-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
}
.search-input:focus {
    border-color: var(--primary);
    background: var(--bg);
}
.suggestions {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    max-height: 320px;
    overflow-y: auto;
    z-index: 10;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
.suggestions.active {
    display: block;
}
.suggestion-item {
    display: flex;
    gap: 12px;
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.15s;
}
.suggestion-item:last-child {
    border-bottom: none;
}
.suggestion-item:hover {
    background: #23232b;
}
.suggestion-item img {
    width: 56px;
    height: 56px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--bg);
    flex-shrink: 0;
}
.suggestion-info {
    flex: 1;
    min-width: 0;
}
.suggestion-info h4 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
}
.suggestion-meta {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
}
.game-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.game-card {
    background: var(--panel);
    border-radius: 8px;
    padding: 12px;
    border: 1px solid var(--border);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.game-card:hover {
    border-color: var(--border-light);
}
.game-card.edit-mode {
    border-color: var(--primary);
    padding: 16px;
    gap: 16px;
    background: #1a1a22;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.game-cover {
    width: 90px;
    height: 90px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--bg);
    flex-shrink: 0;
    transition: all 0.3s ease;
}
.game-card.edit-mode .game-cover {
    width: 140px;
    height: 140px;
}
.game-body {
    flex: 1;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    transition: all 0.3s ease;
}
.game-card.edit-mode .game-body {
    justify-content: flex-start;
    gap: 12px;
}
.game-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 8px;
}
.game-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    transition: font-size 0.3s ease;
}
.game-card.edit-mode .game-title {
    font-size: 20px;
}
.game-rating-badge {
    background: #2a2a35;
    color: #e0e0e0;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid #3f3f4a;
}
.user-rating-badge {
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.game-meta {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
}
.game-tags-view {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
}
.game-tag-view {
    background: #23232b;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    color: #b0b0c0;
    border: 1px solid #2d2d38;
}
.game-notes-preview {
    font-size: 12px;
    color: #8a8a9d;
    font-style: italic;
    margin-top: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.game-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
}
.action-btn {
    background: transparent;
    border: 1px solid var(--border-light);
    color: var(--text-muted);
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.action-btn:hover {
    background: #23232b;
    color: var(--text);
}
.action-btn.delete:hover {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
}
.edit-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.edit-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
}
.rating-picker {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
}
.rating-btn {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    border: 1px solid rgba(0,0,0,0.3);
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
    opacity: 0.8;
}
.rating-btn:hover {
    transform: scale(1.1);
    opacity: 1;
}
.rating-btn.active {
    opacity: 1;
    box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--primary);
    transform: scale(1.1);
}
.tags-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
.tag-chip {
    padding: 4px 10px;
    border-radius: 20px;
    background: #23232b;
    border: 1px solid var(--border-light);
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
}
.tag-chip:hover {
    background: #2d2d38;
    color: var(--text);
}
.tag-chip.selected {
    background: var(--primary-grad);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 2px 5px rgba(124, 58, 237, 0.3);
}
.game-notes {
    width: 100%;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-light);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    resize: vertical;
    min-height: 60px;
    max-height: 150px;
    outline: none;
    transition: border-color 0.2s;
}
.game-notes:focus {
    border-color: var(--primary);
}
.empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 48px 16px;
    font-size: 15px;
}
.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--primary);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
}
.toast.show {
    opacity: 1;
}
@media (max-width: 640px) {
    .game-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    .game-header {
        flex-direction: column;
        align-items: center;
    }
    .game-meta {
        justify-content: center;
    }
    .game-tags-view {
        justify-content: center;
    }
    .game-actions {
        justify-content: center;
    }
    .edit-section {
        align-items: center;
    }
    .rating-picker, .tags-picker {
        justify-content: center;
    }
    .share-bar {
        justify-content: center;
    }
    .share-bar input {
        max-width: 100%;
    }
}
</style>
</head>
<body>
<div class="app">
    <header>
        <h1>🎮 Game Tracker</h1>
        <div class="share-bar">
            <input type="text" id="shareLinkInput" placeholder="Ссылка для друга" readonly>
            <button class="btn btn-primary" id="copyShareBtn">Копировать</button>
            <button class="btn btn-primary" id="generateShareBtn">Обновить</button>
        </div>
    </header>

    <div class="search-section">
        <input type="text" class="search-input" id="searchInput" placeholder="Поиск среди игр..." autocomplete="off">
        <div class="suggestions" id="suggestions"></div>
    </div>

    <div class="game-list" id="gameList"></div>
    <div class="empty-state" id="emptyState">Пока нет пройденных игр. Найдите игру через поиск выше.</div>
</div>

<div class="toast" id="toast">Ссылка скопирована!</div>

<script>
let GAME_DATABASE = [];
const PRESET_TAGS = [
    "Хороший геймплей", "Сюжет", "Атмосфера", "Сложная", "Стелс", 
    "Открытый мир", "Музыка", "Визуал", "Оптимизация", "Расслабляющая", 
    "Хоррор", "RPG", "Шутер", "Песочница", "Инди"
];

// Мягкие, благородные цвета от красного к изумрудному
const RATING_COLORS = [
    '', 
    '#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', 
    '#22c55e', '#10b981', '#059669', '#047857', '#065f46'
];

const STORAGE_KEY = 'game_tracker_games_v3';
const searchInput = document.getElementById('searchInput');
const suggestionsBox = document.getElementById('suggestions');
const gameList = document.getElementById('gameList');
const emptyState = document.getElementById('emptyState');
const shareLinkInput = document.getElementById('shareLinkInput');
const copyShareBtn = document.getElementById('copyShareBtn');
const generateShareBtn = document.getElementById('generateShareBtn');
const toast = document.getElementById('toast');

let games = [];
let debounceTimer = null;

async function initDatabase() {
    try {
        const response = await fetch('hltb_games.json');
        if (!response.ok) throw new Error('Network response was not ok');
        GAME_DATABASE = await response.json();
        console.log(`База данных загружена: ${GAME_DATABASE.length} игр`);
        searchInput.placeholder = `Поиск среди ${GAME_DATABASE.length} игр...`;
        loadGames();
        loadFromHash();
        renderGames();
        generateShareLink();
    } catch (error) {
        console.error('Ошибка загрузки базы:', error);
        showToast('Ошибка загрузки базы. Открой через Live Server.');
        searchInput.placeholder = 'Ошибка загрузки базы данных';
        searchInput.disabled = true;
    }
}

function loadGames() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            games = JSON.parse(saved);
        }
    } catch (e) {
        games = [];
    }
}

function saveGames() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
}

function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function renderGames() {
    if (games.length === 0) {
        gameList.innerHTML = '';
        emptyState.style.display = 'block';
        return;
    }
    emptyState.style.display = 'none';
    
    gameList.innerHTML = games.map((game, index) => {
        const isEditing = game.isEditing;
        
        if (isEditing) {
            const ratingButtons = Array.from({length: 10}, (_, i) => {
                const val = i + 1;
                const isActive = game.userRating === val;
                return `<button class="rating-btn ${isActive ? 'active' : ''}" style="background: ${RATING_COLORS[val]}" data-game-index="${index}" data-val="${val}">${val}</button>`;
            }).join('');
            
            const tagChips = PRESET_TAGS.map(tag => {
                const isSelected = game.tags && game.tags.includes(tag);
                return `<div class="tag-chip ${isSelected ? 'selected' : ''}" data-game-index="${index}" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)}</div>`;
            }).join('');

            return `
                <div class="game-card edit-mode" data-game-index="${index}">
                    <img class="game-cover" src="${game.background_image || 'https://via.placeholder.com/140x140/18181f/9a9aad?text=No+Cover'}" alt="${escapeHtml(game.name)}">
                    <div class="game-body">
                        <div class="game-header">
                            <div class="game-title">${escapeHtml(game.name)}</div>
                            <div class="game-rating-badge">⭐ Народная: ${game.rating || '—'}</div>
                        </div>
                        <div class="game-meta">
                            <span>⏱ ${game.playtime ? game.playtime + ' ч' : '—'}</span>
                            <span>📅 ${game.released ? game.released.slice(0, 4) : '—'}</span>
                        </div>
                        
                        <div class="edit-section">
                            <div class="edit-label">Ваша оценка:</div>
                            <div class="rating-picker">${ratingButtons}</div>
                        </div>
                        
                        <div class="edit-section">
                            <div class="edit-label">Теги:</div>
                            <div class="tags-picker">${tagChips}</div>
                        </div>

                        <textarea class="game-notes" rows="2" placeholder="Что понравилось, краткое описание..." data-game-index="${index}">${escapeHtml(game.notes || '')}</textarea>
                        
                        <div class="game-actions">
                            <button class="action-btn btn-success save-btn" data-game-index="${index}">Сохранить</button>
                            <button class="action-btn delete delete-btn" data-game-index="${index}">Удалить</button>
                        </div>
                    </div>
                </div>
            `;
        } else {
            const tagsHtml = (game.tags || []).map(tag => `<span class="game-tag-view">${escapeHtml(tag)}</span>`).join('');
            const userRatingHtml = game.userRating ? `<div class="user-rating-badge" style="background: ${RATING_COLORS[game.userRating]}">⭐ ${game.userRating} / 10</div>` : '';
            const notesPreview = game.notes ? `<div class="game-notes-preview">"${escapeHtml(game.notes)}"</div>` : '';
            
            return `
                <div class="game-card" data-game-index="${index}">
                    <img class="game-cover" src="${game.background_image || 'https://via.placeholder.com/90x90/18181f/9a9aad?text=No+Cover'}" alt="${escapeHtml(game.name)}" loading="lazy">
                    <div class="game-body">
                        <div class="game-header">
                            <div class="game-title">${escapeHtml(game.name)}</div>
                            <div style="display:flex; gap: 8px; flex-wrap: wrap;">
                                ${userRatingHtml}
                                <div class="game-rating-badge">Народная: ${game.rating || '—'}</div>
                            </div>
                        </div>
                        <div class="game-meta">
                            <span>⏱ ${game.playtime ? game.playtime + ' ч' : '—'}</span>
                            <span>📅 ${game.released ? game.released.slice(0, 4) : '—'}</span>
                        </div>
                        <div class="game-tags-view">${tagsHtml}</div>
                        ${notesPreview}
                        <div class="game-actions">
                            <button class="action-btn edit-btn" data-game-index="${index}">Изменить</button>
                        </div>
                    </div>
                </div>
            `;
        }
    }).join('');
}

function addGameFromSearch(gameData) {
    const exists = games.some(g => g.id === gameData.id);
    if (exists) {
        showToast('Эта игра уже добавлена');
        return;
    }
    games.unshift({
        id: gameData.id,
        name: gameData.name,
        background_image: gameData.background_image,
        rating: gameData.rating,
        playtime: gameData.playtime,
        released: gameData.released,
        userRating: null,
        tags: [],
        notes: '',
        isEditing: true
    });
    saveGames();
    renderGames();
    searchInput.value = '';
    suggestionsBox.classList.remove('active');
    suggestionsBox.innerHTML = '';
    showToast('Игра добавлена. Нажмите Сохранить.');
}

function searchLocalGames(query) {
    if (!query.trim()) {
        suggestionsBox.classList.remove('active');
        suggestionsBox.innerHTML = '';
        return;
    }
    
    const lowerQuery = query.toLowerCase();
    const filtered = [];
    
    for (let i = 0; i < GAME_DATABASE.length; i++) {
        const game = GAME_DATABASE[i];
        if (game.name && game.name.toLowerCase().includes(lowerQuery)) {
            filtered.push(game);
            if (filtered.length >= 10) break;
        }
    }
    
    if (filtered.length === 0) {
        suggestionsBox.innerHTML = '<div style="padding:16px;color:var(--text-muted);text-align:center;">Ничего не найдено</div>';
        suggestionsBox.classList.add('active');
        return;
    }
    
    suggestionsBox.innerHTML = filtered.map(game => `
        <div class="suggestion-item" data-game='${JSON.stringify({
            id: game.id,
            name: game.name,
            background_image: game.background_image,
            rating: game.rating,
            playtime: game.playtime,
            released: game.released
        }).replace(/'/g, "&#39;")}'>
            <img src="${game.background_image || 'https://via.placeholder.com/56x56/18181f/9a9aad?text=?'}" alt="${escapeHtml(game.name)}" loading="lazy">
            <div class="suggestion-info">
                <h4>${escapeHtml(game.name)}</h4>
                <div class="suggestion-meta">
                    <span>⭐ ${game.rating || '—'}</span>
                    <span>⏱ ${game.playtime ? game.playtime + ' ч' : '—'}</span>
                    <span>📅 ${game.released ? game.released.slice(0, 4) : '—'}</span>
                </div>
            </div>
        </div>
    `).join('');
    suggestionsBox.classList.add('active');
}

function generateShareLink() {
    if (games.length === 0) {
        shareLinkInput.value = '';
        return;
    }
    const data = games.map(g => ({
        i: g.id,
        r: g.userRating || 0,
        t: g.tags && g.tags.length ? g.tags : undefined,
        n: g.notes || undefined
    }));
    const json = JSON.stringify(data);
    const compressed = LZString.compressToEncodedURIComponent(json);
    const baseUrl = window.location.origin + window.location.pathname;
    shareLinkInput.value = `${baseUrl}#data=${compressed}`;
}

function loadFromHash() {
    const hash = window.location.hash;
    if (!hash || !hash.startsWith('#data=')) return;
    const compressed = hash.slice(6);
    try {
        const json = LZString.decompressFromEncodedURIComponent(compressed);
        if (!json) return;
        const data = JSON.parse(json);
        if (Array.isArray(data) && data.length > 0) {
            games = data.map(g => {
                const dbGame = GAME_DATABASE.find(db => db.id === g.i);
                return {
                    id: g.i,
                    name: dbGame ? dbGame.name : 'Unknown',
                    background_image: dbGame ? dbGame.background_image : null,
                    rating: dbGame ? dbGame.rating : 0,
                    playtime: dbGame ? dbGame.playtime : 0,
                    released: dbGame ? dbGame.released : '',
                    userRating: g.r || null,
                    tags: g.t || [],
                    notes: g.n || '',
                    isEditing: false
                };
            });
            saveGames();
            renderGames();
            showToast('Список загружен по ссылке');
        }
    } catch (e) {
        console.error(e);
    }
}

searchInput.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    const query = this.value;
    debounceTimer = setTimeout(() => searchLocalGames(query), 200);
});

suggestionsBox.addEventListener('click', function (e) {
    const item = e.target.closest('.suggestion-item');
    if (!item) return;
    const gameData = JSON.parse(item.dataset.game);
    addGameFromSearch(gameData);
});

document.addEventListener('click', function (e) {
    if (!e.target.closest('.search-section')) {
        suggestionsBox.classList.remove('active');
    }
});

gameList.addEventListener('click', function (e) {
    const target = e.target;
    
    if (target.classList.contains('delete-btn')) {
        const index = parseInt(target.dataset.gameIndex);
        games.splice(index, 1);
        saveGames();
        renderGames();
        showToast('Игра удалена');
        return;
    }
    
    if (target.classList.contains('save-btn')) {
        const index = parseInt(target.dataset.gameIndex);
        games[index].isEditing = false;
        saveGames();
        renderGames();
        showToast('Сохранено');
        return;
    }

    if (target.classList.contains('edit-btn')) {
        const index = parseInt(target.dataset.gameIndex);
        games[index].isEditing = true;
        renderGames();
        return;
    }

    if (target.classList.contains('rating-btn')) {
        const index = parseInt(target.dataset.gameIndex);
        const val = parseInt(target.dataset.val);
        games[index].userRating = (games[index].userRating === val) ? null : val;
        saveGames();
        renderGames();
        return;
    }

    if (target.classList.contains('tag-chip')) {
        const index = parseInt(target.dataset.gameIndex);
        const tag = target.dataset.tag;
        if (!games[index].tags) games[index].tags = [];
        if (games[index].tags.includes(tag)) {
            games[index].tags = games[index].tags.filter(t => t !== tag);
        } else {
            games[index].tags.push(tag);
        }
        saveGames();
        renderGames();
        return;
    }
});

gameList.addEventListener('input', function (e) {
    if (e.target.classList.contains('game-notes')) {
        const index = parseInt(e.target.dataset.gameIndex);
        games[index].notes = e.target.value;
        saveGames();
    }
});

copyShareBtn.addEventListener('click', function () {
    if (!shareLinkInput.value) {
        generateShareLink();
    }
    shareLinkInput.select();
    document.execCommand('copy');
    showToast('Ссылка скопирована!');
});

generateShareBtn.addEventListener('click', function () {
    generateShareLink();
    showToast('Ссылка обновлена');
});

window.addEventListener('hashchange', loadFromHash);

initDatabase();
</script>
</body>
</html>
