<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tracker — личный список пройденных игр</title>
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app {
            max-width: 1000px;
            width: 100%;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .share-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .share-bar input {
            padding: 0.6rem 1rem;
            border-radius: 999px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 0.9rem;
            min-width: 260px;
            outline: none;
        }
        .share-bar input:focus {
            border-color: #60a5fa;
        }
        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 999px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            background: #334155;
            color: #e2e8f0;
        }
        .btn:hover {
            background: #475569;
        }
        .btn-primary {
            background: #3b82f6;
            color: #fff;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-success {
            background: #10b981;
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
        }
        .search-section {
            position: relative;
            margin-bottom: 2rem;
        }
        .search-input {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        .search-input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }
        .suggestions {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            max-height: 360px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .suggestions.active {
            display: block;
        }
        .suggestion-item {
            display: flex;
            gap: 1rem;
            padding: 0.8rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid #334155;
            align-items: center;
            transition: 0.15s;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item:hover {
            background: #334155;
        }
        .suggestion-item img {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            object-fit: cover;
            background: #0f172a;
            flex-shrink: 0;
        }
        .suggestion-info {
            flex: 1;
            min-width: 0;
        }
        .suggestion-info h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .suggestion-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: #94a3b8;
            flex-wrap: wrap;
        }
        .suggestion-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .game-card {
            background: #1e293b;
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid #334155;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            transition: 0.2s;
        }
        .game-card:hover {
            border-color: #475569;
        }
        .game-cover {
            width: 160px;
            height: 160px;
            border-radius: 14px;
            object-fit: cover;
            background: #0f172a;
            flex-shrink: 0;
        }
        .game-body {
            flex: 1;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .game-title {
            font-size: 1.2rem;
            font-weight: 700;
        }
        .game-rating-badge {
            background: #3b82f6;
            color: #fff;
            padding: 0.2rem 0.7rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .game-meta {
            display: flex;
            gap: 1.2rem;
            font-size: 0.85rem;
            color: #94a3b8;
            flex-wrap: wrap;
        }
        .game-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .user-controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 0.3rem;
        }
        .user-score {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .user-score label {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .user-score input {
            width: 70px;
            padding: 0.4rem 0.6rem;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.9rem;
            text-align: center;
            outline: none;
        }
        .user-score input:focus {
            border-color: #60a5fa;
        }
        .tags-section {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .tags-label {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .tag {
            background: #334155;
            padding: 0.2rem 0.7rem;
            border-radius: 999px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .tag button {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0;
            line-height: 1;
        }
        .tag button:hover {
            color: #f87171;
        }
        .tag-input-row {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .tag-input-row input {
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.8rem;
            outline: none;
            min-width: 140px;
        }
        .tag-input-row input:focus {
            border-color: #60a5fa;
        }
        .tag-input-row button {
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            border: none;
            background: #3b82f6;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .tag-input-row button:hover {
            background: #2563eb;
        }
        .game-notes {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 60px;
            outline: none;
        }
        .game-notes:focus {
            border-color: #60a5fa;
        }
        .remove-btn {
            align-self: flex-start;
            background: transparent;
            border: 1px solid #7f1d1d;
            color: #f87171;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .remove-btn:hover {
            background: #7f1d1d;
            color: #fff;
        }
        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 3rem 1rem;
            font-size: 1.1rem;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: #fff;
            padding: 0.8rem 1.5rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }
        .toast.show {
            opacity: 1;
        }
        @media (max-width: 640px) {
            .game-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .game-header {
                flex-direction: column;
                align-items: center;
            }
            .game-meta {
                justify-content: center;
            }
            .user-controls {
                justify-content: center;
            }
            .tags-list {
                justify-content: center;
            }
            .tag-input-row {
                justify-content: center;
            }
            .remove-btn {
                align-self: center;
            }
            .share-bar input {
                min-width: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>🎮 Game Tracker</h1>
            <div class="share-bar">
                <input type="text" id="shareLinkInput" placeholder="Ссылка для друга" readonly>
                <button class="btn btn-primary" id="copyShareBtn">Копировать</button>
                <button class="btn btn-success" id="generateShareBtn">Обновить ссылку</button>
            </div>
        </header>

        <div class="search-section">
            <input type="text" class="search-input" id="searchInput" placeholder="Начните вводить название игры..." autocomplete="off">
            <div class="suggestions" id="suggestions"></div>
        </div>

        <div class="game-list" id="gameList"></div>
        <div class="empty-state" id="emptyState">Пока нет пройденных игр. Найдите игру через поиск выше.</div>
    </div>

    <div class="toast" id="toast">Ссылка скопирована!</div>

    <script>
        const RAWG_API_KEY = 'YOUR_RAWG_API_KEY';
        const STORAGE_KEY = 'game_tracker_games';

        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestions');
        const gameList = document.getElementById('gameList');
        const emptyState = document.getElementById('emptyState');
        const shareLinkInput = document.getElementById('shareLinkInput');
        const copyShareBtn = document.getElementById('copyShareBtn');
        const generateShareBtn = document.getElementById('generateShareBtn');
        const toast = document.getElementById('toast');

        let games = [];
        let debounceTimer = null;

        function loadGames() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    games = JSON.parse(saved);
                }
            } catch (e) {
                games = [];
            }
        }

        function saveGames() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function renderGames() {
            if (games.length === 0) {
                gameList.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';
            gameList.innerHTML = games.map((game, index) => {
                const tagsHtml = game.tags.map((tag, tagIndex) => `
                    <span class="tag">${escapeHtml(tag)}<button data-game-index="${index}" data-tag-index="${tagIndex}" class="remove-tag">×</button></span>
                `).join('');
                return `
                    <div class="game-card" data-game-index="${index}">
                        <img class="game-cover" src="${game.background_image || 'https://via.placeholder.com/160x160/1e293b/64748b?text=No+Cover'}" alt="${escapeHtml(game.name)}" loading="lazy">
                        <div class="game-body">
                            <div class="game-header">
                                <div class="game-title">${escapeHtml(game.name)}</div>
                                <div class="game-rating-badge">⭐ ${game.rating || '—'} / 10</div>
                            </div>
                            <div class="game-meta">
                                <span>⏱ ${game.playtime ? game.playtime + ' ч' : '—'}</span>
                                <span>📅 ${game.released ? game.released.slice(0, 4) : '—'}</span>
                            </div>
                            <div class="user-controls">
                                <div class="user-score">
                                    <label>Моя оценка:</label>
                                    <input type="number" min="1" max="10" value="${game.userRating || ''}" placeholder="1-10" data-game-index="${index}" class="user-rating-input">
                                </div>
                            </div>
                            <div class="tags-section">
                                <div class="tags-label">Теги:</div>
                                <div class="tags-list" id="tags-list-${index}">${tagsHtml}</div>
                                <div class="tag-input-row">
                                    <input type="text" placeholder="Добавить тег..." id="tag-input-${index}" data-game-index="${index}">
                                    <button data-game-index="${index}" class="add-tag-btn">+</button>
                                </div>
                            </div>
                            <textarea class="game-notes" placeholder="Что понравилось, краткое описание..." data-game-index="${index}">${escapeHtml(game.notes || '')}</textarea>
                            <button class="remove-btn" data-game-index="${index}">Удалить игру</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addGameFromSearch(gameData) {
            const exists = games.some(g => g.id === gameData.id);
            if (exists) {
                showToast('Эта игра уже добавлена');
                return;
            }
            games.push({
                id: gameData.id,
                name: gameData.name,
                background_image: gameData.background_image,
                rating: gameData.rating,
                playtime: gameData.playtime,
                released: gameData.released,
                userRating: null,
                tags: [],
                notes: ''
            });
            saveGames();
            renderGames();
            searchInput.value = '';
            suggestionsBox.classList.remove('active');
            suggestionsBox.innerHTML = '';
            showToast('Игра добавлена');
        }

        function fetchGames(query) {
            if (!query.trim()) {
                suggestionsBox.classList.remove('active');
                suggestionsBox.innerHTML = '';
                return;
            }
            fetch(`https://api.rawg.io/api/games?key=${RAWG_API_KEY}&search=${encodeURIComponent(query)}&page_size=6`)
                .then(res => {
                    if (!res.ok) throw new Error('API error');
                    return res.json();
                })
                .then(data => {
                    if (!data.results || data.results.length === 0) {
                        suggestionsBox.innerHTML = '<div style="padding:1rem;color:#64748b;text-align:center;">Ничего не найдено</div>';
                        suggestionsBox.classList.add('active');
                        return;
                    }
                    suggestionsBox.innerHTML = data.results.map(game => `
                        <div class="suggestion-item" data-game='${JSON.stringify({
                            id: game.id,
                            name: game.name,
                            background_image: game.background_image,
                            rating: game.rating,
                            playtime: game.playtime,
                            released: game.released
                        }).replace(/'/g, "&#39;")}'>
                            <img src="${game.background_image || 'https://via.placeholder.com/64x64/1e293b/64748b?text=?'}" alt="${escapeHtml(game.name)}">
                            <div class="suggestion-info">
                                <h4>${escapeHtml(game.name)}</h4>
                                <div class="suggestion-meta">
                                    <span>⭐ ${game.rating || '—'}</span>
                                    <span>⏱ ${game.playtime ? game.playtime + ' ч' : '—'}</span>
                                    <span>📅 ${game.released ? game.released.slice(0, 4) : '—'}</span>
                                </div>
                            </div>
                        </div>
                    `).join('');
                    suggestionsBox.classList.add('active');
                })
                .catch(() => {
                    suggestionsBox.innerHTML = '<div style="padding:1rem;color:#f87171;text-align:center;">Ошибка загрузки. Проверьте API-ключ.</div>';
                    suggestionsBox.classList.add('active');
                });
        }

        function generateShareLink() {
            if (games.length === 0) {
                shareLinkInput.value = '';
                showToast('Список пуст');
                return;
            }
            const data = games.map(g => ({
                id: g.id,
                name: g.name,
                background_image: g.background_image,
                rating: g.rating,
                playtime: g.playtime,
                released: g.released,
                userRating: g.userRating,
                tags: g.tags,
                notes: g.notes
            }));
            const json = JSON.stringify(data);
            const compressed = LZString.compressToEncodedURIComponent(json);
            const baseUrl = window.location.origin + window.location.pathname;
            const shareUrl = `${baseUrl}#data=${compressed}`;
            shareLinkInput.value = shareUrl;
        }

        function loadFromHash() {
            const hash = window.location.hash;
            if (!hash || !hash.startsWith('#data=')) return;
            const compressed = hash.slice(6);
            try {
                const json = LZString.decompressFromEncodedURIComponent(compressed);
                if (!json) return;
                const data = JSON.parse(json);
                if (Array.isArray(data) && data.length > 0) {
                    games = data;
                    saveGames();
                    renderGames();
                    showToast('Список загружен по ссылке');
                }
            } catch (e) {}
        }

        searchInput.addEventListener('input', function () {
            clearTimeout(debounceTimer);
            const query = this.value;
            debounceTimer = setTimeout(() => fetchGames(query), 350);
        });

        suggestionsBox.addEventListener('click', function (e) {
            const item = e.target.closest('.suggestion-item');
            if (!item) return;
            const gameData = JSON.parse(item.dataset.game);
            addGameFromSearch(gameData);
        });

        document.addEventListener('click', function (e) {
            if (!e.target.closest('.search-section')) {
                suggestionsBox.classList.remove('active');
            }
        });

        gameList.addEventListener('click', function (e) {
            if (e.target.classList.contains('remove-btn')) {
                const index = parseInt(e.target.dataset.gameIndex);
                games.splice(index, 1);
                saveGames();
                renderGames();
                showToast('Игра удалена');
                return;
            }
            if (e.target.classList.contains('remove-tag')) {
                const gameIndex = parseInt(e.target.dataset.gameIndex);
                const tagIndex = parseInt(e.target.dataset.tagIndex);
                games[gameIndex].tags.splice(tagIndex, 1);
                saveGames();
                renderGames();
                return;
            }
            if (e.target.classList.contains('add-tag-btn')) {
                const gameIndex = parseInt(e.target.dataset.gameIndex);
                const input = document.getElementById(`tag-input-${gameIndex}`);
                const tag = input.value.trim();
                if (tag && !games[gameIndex].tags.includes(tag)) {
                    games[gameIndex].tags.push(tag);
                    saveGames();
                    renderGames();
                }
                input.value = '';
                return;
            }
        });

        gameList.addEventListener('input', function (e) {
            if (e.target.classList.contains('user-rating-input')) {
                const index = parseInt(e.target.dataset.gameIndex);
                let val = parseInt(e.target.value);
                if (isNaN(val) || val < 1) val = null;
                if (val > 10) val = 10;
                games[index].userRating = val;
                saveGames();
            }
            if (e.target.classList.contains('game-notes')) {
                const index = parseInt(e.target.dataset.gameIndex);
                games[index].notes = e.target.value;
                saveGames();
            }
        });

        gameList.addEventListener('keydown', function (e) {
            if (e.target.classList.contains('tag-input-row') || e.target.closest('.tag-input-row')) {
                if (e.key === 'Enter') {
                    const input = e.target.closest('.tag-input-row').querySelector('input');
                    const gameIndex = parseInt(input.dataset.gameIndex);
                    const tag = input.value.trim();
                    if (tag && !games[gameIndex].tags.includes(tag)) {
                        games[gameIndex].tags.push(tag);
                        saveGames();
                        renderGames();
                    }
                    input.value = '';
                    e.preventDefault();
                }
            }
        });

        copyShareBtn.addEventListener('click', function () {
            if (!shareLinkInput.value) {
                generateShareLink();
            }
            shareLinkInput.select();
            document.execCommand('copy');
            showToast('Ссылка скопирована!');
        });

        generateShareBtn.addEventListener('click', function () {
            generateShareLink();
            showToast('Ссылка обновлена');
        });

        window.addEventListener('hashchange', loadFromHash);

        loadGames();
        loadFromHash();
        renderGames();
        generateShareLink();
    </script>
</body>
</html>
