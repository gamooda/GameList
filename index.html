<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<style>
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}
::-webkit-scrollbar-track {
    background: var(--bg);
}
::-webkit-scrollbar-thumb {
    background: #333338;
    border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
    background: #4a4a50;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
    user-select: none;
}
input, textarea {
    user-select: text;
}
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { 
    -webkit-appearance: none; 
    margin: 0; 
}
input[type=number] {
    -moz-appearance: textfield;
}

:root {
    --bg: #0f0f13;
    --panel: #18181f;
    --border: #27272e;
    --border-light: #3f3f4a;
    --text: #f0f0f5;
    --text-muted: #9a9aad;
    --primary: #7c3aed;
    --primary-grad: linear-gradient(135deg, #8b5cf6, #6d28d9);
    --primary-hover: #6d28d9;
    --danger: #ef4444;
    --success: #10b981;
}
body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    perspective: 1000px;
}
.app {
    max-width: 800px;
    width: 100%;
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
}
h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
}
.share-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
    justify-content: flex-end;
}
.share-bar input {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-light);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    flex: 1;
    min-width: 200px;
    max-width: 350px;
    outline: none;
    transition: border-color 0.3s ease;
}
.share-bar input:focus {
    border-color: var(--primary);
}
.btn {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border-light);
    background: var(--panel);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.btn:hover {
    background: #23232b;
    border-color: #555;
    color: var(--text);
}
.btn-primary {
    background: var(--primary-grad);
    border: none;
    color: #fff;
    box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
}
.btn-primary:hover {
    filter: brightness(1.1);
    color: #fff;
    transform: translateY(-1px);
}
.btn-success {
    background: var(--success);
    border: none;
    color: #fff;
}
.btn-success:hover {
    background: #059669;
    transform: translateY(-1px);
}
.search-section {
    position: relative;
    margin-bottom: 24px;
}
.search-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s ease, background 0.3s ease;
}
.search-input:focus {
    border-color: var(--primary);
    background: var(--bg);
}
.suggestions {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    max-height: 320px;
    overflow-y: auto;
    z-index: 10;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
.suggestions.active {
    display: block;
}
.suggestion-item {
    display: flex;
    gap: 12px;
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.2s ease;
}
.suggestion-item:last-child {
    border-bottom: none;
}
.suggestion-item:hover {
    background: #23232b;
}
.suggestion-item img {
    width: 56px;
    height: 56px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--bg);
    flex-shrink: 0;
}
.suggestion-info {
    flex: 1;
    min-width: 0;
}
.suggestion-info h4 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
}
.suggestion-meta {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
}
.game-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.game-card {
    background: var(--panel);
    border-radius: 6px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    z-index: 1;
}
.game-card::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 8px;
    background: var(--card-bg, transparent);
    filter: blur(12px);
    opacity: 0.15;
    z-index: -1;
    transition: opacity 0.3s ease;
    pointer-events: none;
}
.game-card:hover::before {
    opacity: 0.4;
}
.game-card:hover {
    border-color: var(--border-light);
    z-index: 2;
}
.game-card.edit-mode {
    border-color: var(--primary);
    padding: 12px;
    gap: 12px;
    background: #1a1a22;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    align-items: flex-start;
    z-index: 5;
}
.game-card.edit-mode::before {
    display: none;
}
.cover-wrapper {
    width: 48px;
    height: 64px;
    flex-shrink: 0;
    perspective: 600px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
}
.game-cover {
    width: 100%;
    height: 100%;
    border-radius: 4px;
    object-fit: cover;
    background: var(--bg);
    transition: transform 0.1s ease-out, box-shadow 0.3s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    cursor: pointer;
    transform-style: preserve-3d;
}
.game-cover:hover {
    box-shadow: 0 15px 30px rgba(0,0,0,0.8);
}
.game-card.edit-mode .cover-wrapper {
    width: 80px;
    height: 110px;
    pointer-events: none;
}
.game-card.edit-mode .game-cover {
    transform: none !important;
    box-shadow: 0 2px 5px rgba(0,0,0,0.4);
}
.game-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: all 0.3s ease;
}
.game-card.edit-mode .game-body {
    gap: 8px;
}
.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
}
.game-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: font-size 0.3s ease;
}
.game-card.edit-mode .game-title {
    font-size: 16px;
    white-space: normal;
}
.badges-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
}
.game-rating-badge {
    background: #2a2a35;
    color: #e0e0e0;
    padding: 1px 4px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid #3f3f4a;
}
.user-rating-badge {
    color: #fff;
    padding: 1px 4px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}
.game-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--text-muted);
    flex-wrap: wrap;
}
.user-time-badge {
    color: #34d399;
    font-weight: 600;
    background: rgba(16, 185, 129, 0.1);
    padding: 1px 3px;
    border-radius: 2px;
}
.game-tags-view {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    align-items: center;
}
.game-tag-view {
    background: #23232b;
    padding: 0px 4px;
    border-radius: 3px;
    font-size: 9px;
    color: #b0b0c0;
    border: 1px solid #2d2d38;
    white-space: nowrap;
}
.game-notes-preview {
    font-size: 10px;
    color: #8a8a9d;
    font-style: italic;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    margin-top: 1px;
}
.action-btn {
    background: transparent;
    border: 1px solid var(--border-light);
    color: var(--text-muted);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
}
.action-btn:hover {
    background: #23232b;
    color: var(--text);
}
.action-btn.delete:hover {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
}
.edit-section {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.edit-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
}
.edit-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
}
.user-playtime-input-wrapper {
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border-light);
    border-radius: 4px;
    padding: 0 8px;
    height: 24px;
    transition: border-color 0.2s;
}
.user-playtime-input-wrapper:focus-within {
    border-color: var(--primary);
}
.user-playtime-input {
    width: 40px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 12px;
    outline: none;
    text-align: center;
}
.user-playtime-input-wrapper span {
    color: var(--text-muted);
    font-size: 11px;
    margin-left: 2px;
}
.rating-picker {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
}
.rating-btn {
    width: 22px;
    height: 22px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.3);
    font-weight: 800;
    font-size: 10px;
    cursor: pointer;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    transition: transform 0.2s, box-shadow 0.2s, filter 0.2s, opacity 0.2s;
    opacity: 0.6;
}
.rating-btn:hover {
    transform: scale(1.1);
    opacity: 1;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.rating-btn.active {
    opacity: 1;
    box-shadow: inset 0 0 0 2px #fff, 0 2px 5px rgba(0,0,0,0.4);
    transform: scale(1.15);
    z-index: 1;
}
.tags-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}
.tag-chip {
    padding: 2px 6px;
    border-radius: 12px;
    background: #23232b;
    border: 1px solid var(--border-light);
    color: var(--text-muted);
    font-size: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
}
.tag-chip:hover {
    background: #2d2d38;
    color: var(--text);
}
.tag-chip.selected {
    background: var(--primary-grad);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 2px 5px rgba(124, 58, 237, 0.3);
}
.game-notes {
    width: 100%;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--border-light);
    background: var(--bg);
    color: var(--text);
    font-size: 11px;
    resize: vertical;
    min-height: 32px;
    max-height: 80px;
    outline: none;
    transition: border-color 0.3s ease;
}
.game-notes:focus {
    border-color: var(--primary);
}
.empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 48px 16px;
    font-size: 14px;
}
.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--primary);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    z-index: 100;
}
.toast.show {
    opacity: 1;
}

.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    overflow: hidden;
}
.lightbox.active {
    opacity: 1;
    pointer-events: auto;
}
.lightbox-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
}
.lightbox-card {
    position: relative;
    transform-style: preserve-3d;
}
.lightbox-face {
    display: block;
    max-width: 85vw;
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    backface-visibility: hidden;
    object-fit: contain;
}
.lightbox-face.back {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotateY(180deg);
}

.esc-btn {
    position: absolute;
    top: 20px;
    right: 30px;
    padding: 6px 14px;
    background: linear-gradient(180deg, #3a3a4a, #1a1a22);
    color: #c0c0d0;
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 1px;
    border: 1px solid #5a5a6e;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 4px 0 #0a0a0f, 0 6px 15px rgba(0,0,0,0.8);
    transition: all 0.1s;
    z-index: 1001;
    user-select: none;
    text-shadow: 0 1px 2px #000;
}
.esc-btn:hover {
    background: linear-gradient(180deg, #4a4a5a, #2a2a35);
    color: #fff;
    transform: translateY(2px);
    box-shadow: 0 2px 0 #0a0a0f, 0 4px 10px rgba(0,0,0,0.8);
}
.esc-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0px 0 #0a0a0f, 0 2px 5px rgba(0,0,0,0.8);
}

@media (max-width: 640px) {
    .game-card {
        flex-direction: column;
        align-items: stretch;
        padding: 10px;
    }
    .cover-wrapper {
        width: 100%;
        height: 120px;
        perspective: none;
    }
    .game-cover {
        width: 100%;
        height: 100%;
        border-radius: 6px;
        pointer-events: none;
    }
    .game-header, .game-meta-row {
        flex-direction: column;
        align-items: flex-start;
    }
    .badges-row {
        margin-top: 4px;
    }
    .edit-row {
        flex-direction: column;
        align-items: flex-start;
    }
    .share-bar {
        justify-content: center;
    }
    .share-bar input {
        max-width: 100%;
    }
    .esc-btn {
        top: 10px;
        right: 15px;
        padding: 4px 10px;
    }
}
</style>
</head>
<body>
<div class="app">
    <header>
        <h1>🎮 Game Tracker</h1>
        <div class="share-bar">
            <input type="text" id="shareLinkInput" placeholder="Ссылка для друга" readonly>
            <button class="btn btn-primary" id="copyShareBtn">Копировать</button>
        </div>
    </header>

    <div class="search-section">
        <input type="text" class="search-input" id="searchInput" placeholder="Поиск среди игр..." autocomplete="off">
        <div class="suggestions" id="suggestions"></div>
    </div>

    <div class="game-list" id="gameList"></div>
    <div class="empty-state" id="emptyState">Пока нет пройденных игр. Найдите игру через поиск выше.</div>
</div>

<div class="lightbox" id="lightbox">
    <div class="esc-btn" id="closeLightbox">ESC</div>
    <div class="lightbox-container">
        <div class="lightbox-card" id="lightboxCard">
            <img class="lightbox-face front" id="lightboxImgFront" src="" alt="Preview" draggable="false">
            <img class="lightbox-face back" id="lightboxImgBack" src="" alt="Preview Back" draggable="false">
        </div>
    </div>
</div>

<div class="toast" id="toast">Ссылка скопирована!</div>

<script>
let GAME_DATABASE = [];
const PRESET_TAGS = [
    "Хороший геймплей", "Сюжет", "Атмосфера", "Сложная", "Стелс", 
    "Открытый мир", "Музыка", "Визуал", "Оптимизация", "Расслабляющая", 
    "Хоррор", "RPG", "Шутер", "Песочница", "Инди"
];

const RATING_COLORS = [
    '', 
    '#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', 
    '#22c55e', '#10b981', '#059669', '#047857', '#065f46'
];

const STORAGE_KEY = 'game_tracker_games_v6';
const searchInput = document.getElementById('searchInput');
const suggestionsBox = document.getElementById('suggestions');
const gameList = document.getElementById('gameList');
const emptyState = document.getElementById('emptyState');
const shareLinkInput = document.getElementById('shareLinkInput');
const copyShareBtn = document.getElementById('copyShareBtn');
const toast = document.getElementById('toast');
const lightbox = document.getElementById('lightbox');
const lightboxCard = document.getElementById('lightboxCard');
const lightboxImgFront = document.getElementById('lightboxImgFront');
const lightboxImgBack = document.getElementById('lightboxImgBack');
const closeLightbox = document.getElementById('closeLightbox');

let games = [];
let debounceTimer = null;

let isDragging = false;
let hasDragged = false;
let previousMousePosition = { x: 0, y: 0 };
let currentRotation = { x: 0, y: 0 };
let isSpinning = true;
let spinAnimationId;
let lastTime = performance.now();

function formatTime(val) {
    if (!val) return '';
    let num = parseFloat(val);
    if (isNaN(num)) return val;
    if (num === 0) return '';
    let h = Math.floor(num);
    let m = Math.round((num - h) * 60);
    if (h > 0 && m > 0) return `${h}ч ${m}м`;
    if (h > 0) return `${h}ч`;
    return `${m}м`;
}

async function initDatabase() {
    try {
        const response = await fetch('hltb_games.json');
        if (!response.ok) throw new Error('Network response was not ok');
        GAME_DATABASE = await response.json();
        searchInput.placeholder = `Поиск среди ${GAME_DATABASE.length} игр...`;
        loadGames();
        loadFromHash();
        renderGames();
        generateShareLink();
    } catch (error) {
        showToast('Ошибка загрузки базы. Открой через Live Server.');
        searchInput.placeholder = 'Ошибка загрузки базы данных';
        searchInput.disabled = true;
    }
}

function loadGames() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            games = JSON.parse(saved);
        }
    } catch (e) {
        games = [];
    }
}

function saveGames() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
}

function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function renderGames() {
    if (games.length === 0) {
        gameList.innerHTML = '';
        emptyState.style.display = 'block';
        return;
    }
    emptyState.style.display = 'none';
    
    gameList.innerHTML = games.map((game, index) => {
        const isEditing = game.isEditing;
        const bgColor = game.background_image ? `url('${game.background_image}')` : 'none';
        
        if (isEditing) {
            const ratingButtons = Array.from({length: 10}, (_, i) => {
                const val = i + 1;
                const isActive = game.userRating === val;
                return `<button class="rating-btn ${isActive ? 'active' : ''}" style="background: ${RATING_COLORS[val]}" data-game-index="${index}" data-val="${val}">${val}</button>`;
            }).join('');
            
            const tagChips = PRESET_TAGS.map(tag => {
                const isSelected = game.tags && game.tags.includes(tag);
                return `<div class="tag-chip ${isSelected ? 'selected' : ''}" data-game-index="${index}" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)}</div>`;
            }).join('');

            return `
                <div class="game-card edit-mode" data-game-index="${index}">
                    <div class="cover-wrapper">
                        <img class="game-cover" src="${game.background_image || 'https://via.placeholder.com/80x110/18181f/9a9aad?text=No+Cover'}" alt="${escapeHtml(game.name)}" draggable="false">
                    </div>
                    <div class="game-body">
                        <div class="game-header">
                            <div class="game-title">${escapeHtml(game.name)}</div>
                            <div class="badges-row">
                                <div class="game-rating-badge">⭐ Народная: ${game.rating || '—'}</div>
                            </div>
                        </div>
                        <div class="game-meta">
                            <span>⏱ HLTB: ${game.playtime ? game.playtime + ' ч' : '—'}</span>
                            <span>📅 ${game.released ? game.released.slice(0, 4) : '—'}</span>
                        </div>
                        
                        <div class="edit-row">
                            <div class="edit-section">
                                <div class="edit-label">Ваша оценка:</div>
                                <div class="rating-picker">${ratingButtons}</div>
                            </div>
                            <div class="edit-section">
                                <div class="edit-label">Ваше время:</div>
                                <div class="user-playtime-input-wrapper">
                                    <input type="number" step="0.1" min="0" class="user-playtime-input" data-game-index="${index}" value="${game.userPlaytime || ''}" placeholder="0">
                                    <span>ч</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="edit-section">
                            <div class="edit-label">Теги:</div>
                            <div class="tags-picker">${tagChips}</div>
                        </div>

                        <textarea class="game-notes" rows="1" placeholder="Краткое описание..." data-game-index="${index}">${escapeHtml(game.notes || '')}</textarea>
                        
                        <div class="game-actions" style="display:flex; gap:6px;">
                            <button class="action-btn btn-success save-btn" data-game-index="${index}">Сохранить</button>
                            <button class="action-btn delete delete-btn" data-game-index="${index}">Удалить</button>
                        </div>
                    </div>
                </div>
            `;
        } else {
            const tagsHtml = (game.tags || []).map(tag => `<span class="game-tag-view">${escapeHtml(tag)}</span>`).join('');
            const userRatingHtml = game.userRating ? `<div class="user-rating-badge" style="background: ${RATING_COLORS[game.userRating]}">⭐ ${game.userRating} / 10</div>` : '';
            
            let timeStr = formatTime(game.userPlaytime);
            const userTimeHtml = timeStr ? `<span class="user-time-badge">⏱ Моё: ${timeStr}</span>` : '';
            
            const notesPreview = game.notes ? `<div class="game-notes-preview">"${escapeHtml(game.notes)}"</div>` : '';
            
            return `
                <div class="game-card" data-game-index="${index}" style="--card-bg: ${bgColor}">
                    <div class="cover-wrapper">
                        <img class="game-cover" src="${game.background_image || 'https://via.placeholder.com/48x64/18181f/9a9aad?text=No+Cover'}" alt="${escapeHtml(game.name)}" loading="lazy" data-index="${index}" draggable="false">
                    </div>
                    <div class="game-body">
                        <div class="game-header">
                            <div class="game-title">${escapeHtml(game.name)}</div>
                            <div class="badges-row">
                                ${userRatingHtml}
                                <div class="game-rating-badge">Народная: ${game.rating || '—'}</div>
                            </div>
                        </div>
                        
                        <div class="game-meta" style="justify-content: space-between;">
                            <div style="display:flex; gap:6px; align-items:center;">
                                <span>⏱ HLTB: ${game.playtime ? game.playtime + 'ч' : '—'}</span>
                                ${userTimeHtml}
                                <span>📅 ${game.released ? game.released.slice(0, 4) : '—'}</span>
                            </div>
                            <div style="display:flex; gap:6px; align-items:center;">
                                <div class="game-tags-view">${tagsHtml}</div>
                                <button class="action-btn edit-btn" data-game-index="${index}">Изменить</button>
                            </div>
                        </div>
                        ${notesPreview}
                    </div>
                </div>
            `;
        }
    }).join('');
}

function addGameFromSearch(gameData) {
    const exists = games.some(g => g.id === gameData.id);
    if (exists) {
        showToast('Эта игра уже добавлена');
        return;
    }
    games.unshift({
        id: gameData.id,
        name: gameData.name,
        background_image: gameData.background_image,
        rating: gameData.rating,
        playtime: gameData.playtime,
        released: gameData.released,
        userRating: null,
        userPlaytime: null,
        tags: [],
        notes: '',
        isEditing: true
    });
    saveGames();
    renderGames();
    searchInput.value = '';
    suggestionsBox.classList.remove('active');
    suggestionsBox.innerHTML = '';
    showToast('Игра добавлена. Нажмите Сохранить.');
}

function searchLocalGames(query) {
    if (!query.trim()) {
        suggestionsBox.classList.remove('active');
        suggestionsBox.innerHTML = '';
        return;
    }
    
    const lowerQuery = query.toLowerCase();
    const filtered = [];
    
    for (let i = 0; i < GAME_DATABASE.length; i++) {
        const game = GAME_DATABASE[i];
        if (game.name && game.name.toLowerCase().includes(lowerQuery)) {
            filtered.push(game);
            if (filtered.length >= 10) break;
        }
    }
    
    if (filtered.length === 0) {
        suggestionsBox.innerHTML = '<div style="padding:16px;color:var(--text-muted);text-align:center;">Ничего не найдено</div>';
        suggestionsBox.classList.add('active');
        return;
    }
    
    suggestionsBox.innerHTML = filtered.map(game => `
        <div class="suggestion-item" data-game='${JSON.stringify({
            id: game.id,
            name: game.name,
            background_image: game.background_image,
            rating: game.rating,
            playtime: game.playtime,
            released: game.released
        }).replace(/'/g, "&#39;")}'>
            <img src="${game.background_image || 'https://via.placeholder.com/56x56/18181f/9a9aad?text=?'}" alt="${escapeHtml(game.name)}" loading="lazy">
            <div class="suggestion-info">
                <h4>${escapeHtml(game.name)}</h4>
                <div class="suggestion-meta">
                    <span>⭐ ${game.rating || '—'}</span>
                    <span>⏱ ${game.playtime ? game.playtime + ' ч' : '—'}</span>
                    <span>📅 ${game.released ? game.released.slice(0, 4) : '—'}</span>
                </div>
            </div>
        </div>
    `).join('');
    suggestionsBox.classList.add('active');
}

function generateShareLink() {
    if (games.length === 0) {
        shareLinkInput.value = '';
        return;
    }
    const data = games.map(g => ({
        i: g.id,
        r: g.userRating || 0,
        p: g.userPlaytime || 0,
        t: g.tags && g.tags.length ? g.tags : undefined,
        n: g.notes || undefined
    }));
    const json = JSON.stringify(data);
    const compressed = LZString.compressToEncodedURIComponent(json);
    const baseUrl = window.location.origin + window.location.pathname;
    shareLinkInput.value = `${baseUrl}#data=${compressed}`;
}

function loadFromHash() {
    const hash = window.location.hash;
    if (!hash || !hash.startsWith('#data=')) return;
    const compressed = hash.slice(6);
    try {
        const json = LZString.decompressFromEncodedURIComponent(compressed);
        if (!json) return;
        const data = JSON.parse(json);
        if (Array.isArray(data) && data.length > 0) {
            games = data.map(g => {
                const dbGame = GAME_DATABASE.find(db => db.id === g.i);
                return {
                    id: g.i,
                    name: dbGame ? dbGame.name : 'Unknown',
                    background_image: dbGame ? dbGame.background_image : null,
                    rating: dbGame ? dbGame.rating : 0,
                    playtime: dbGame ? dbGame.playtime : 0,
                    released: dbGame ? dbGame.released : '',
                    userRating: g.r || null,
                    userPlaytime: g.p || null,
                    tags: g.t || [],
                    notes: g.n || '',
                    isEditing: false
                };
            });
            saveGames();
            renderGames();
            showToast('Список загружен по ссылке');
        }
    } catch (e) {
        console.error(e);
    }
}

gameList.addEventListener('mousemove', function(e) {
    const cover = e.target.closest('.game-cover');
    if (!cover || cover.closest('.edit-mode')) return;
    
    const rect = cover.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    
    const rotateX = ((y - centerY) / centerY) * -25;
    const rotateY = ((x - centerX) / centerX) * 25;
    
    cover.style.transform = `scale(1.4) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});

gameList.addEventListener('mouseout', function(e) {
    const cover = e.target.closest('.game-cover');
    if (cover) {
        cover.style.transform = '';
    }
});

searchInput.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    const query = this.value;
    debounceTimer = setTimeout(() => searchLocalGames(query), 200);
});

suggestionsBox.addEventListener('click', function (e) {
    const item = e.target.closest('.suggestion-item');
    if (!item) return;
    const gameData = JSON.parse(item.dataset.game);
    addGameFromSearch(gameData);
});

document.addEventListener('click', function (e) {
    if (!e.target.closest('.search-section')) {
        suggestionsBox.classList.remove('active');
    }
});

gameList.addEventListener('click', function (e) {
    const target = e.target;
    
    if (target.classList.contains('game-cover') && !target.closest('.edit-mode')) {
        const index = parseInt(target.dataset.index);
        if (games[index] && games[index].background_image) {
            const imgUrl = games[index].background_image;
            lightboxImgFront.src = imgUrl;
            lightboxImgBack.src = imgUrl;
            
            currentRotation = { x: 0, y: 0 };
            hasDragged = false;
            isDragging = false;
            isSpinning = true;
            lightboxCard.style.transform = '';
            lightbox.classList.add('active');
            lastTime = performance.now();
            if (!spinAnimationId) spinAnimationId = requestAnimationFrame(spinLoop);
        }
        return;
    }

    if (target.classList.contains('delete-btn')) {
        const index = parseInt(target.dataset.gameIndex);
        games.splice(index, 1);
        saveGames();
        renderGames();
        showToast('Игра удалена');
        return;
    }
    
    if (target.classList.contains('save-btn')) {
        const index = parseInt(target.dataset.gameIndex);
        games[index].isEditing = false;
        saveGames();
        renderGames();
        showToast('Сохранено');
        return;
    }

    if (target.classList.contains('edit-btn')) {
        const index = parseInt(target.dataset.gameIndex);
        games[index].isEditing = true;
        renderGames();
        return;
    }

    if (target.classList.contains('rating-btn')) {
        const index = parseInt(target.dataset.gameIndex);
        const val = parseInt(target.dataset.val);
        games[index].userRating = (games[index].userRating === val) ? null : val;
        saveGames();
        renderGames();
        return;
    }

    if (target.classList.contains('tag-chip')) {
        const index = parseInt(target.dataset.gameIndex);
        const tag = target.dataset.tag;
        if (!games[index].tags) games[index].tags = [];
        if (games[index].tags.includes(tag)) {
            games[index].tags = games[index].tags.filter(t => t !== tag);
        } else {
            games[index].tags.push(tag);
        }
        saveGames();
        renderGames();
        return;
    }
});

gameList.addEventListener('input', function (e) {
    if (e.target.classList.contains('game-notes')) {
        const index = parseInt(e.target.dataset.gameIndex);
        games[index].notes = e.target.value;
        saveGames();
    }
    if (e.target.classList.contains('user-playtime-input')) {
        const index = parseInt(e.target.dataset.gameIndex);
        let val = parseFloat(e.target.value);
        games[index].userPlaytime = isNaN(val) || val < 0 ? null : val;
        saveGames();
    }
});

function spinLoop(time) {
    if (lightbox.classList.contains('active')) {
        const deltaTime = time - lastTime;
        lastTime = time;

        if (isSpinning && !isDragging) {
            currentRotation.y += deltaTime * 0.03; 
            if (currentRotation.y > 360) currentRotation.y -= 360;
            
            let targetTiltX = Math.sin(currentRotation.y * Math.PI / 180) * 10;
            currentRotation.x += (targetTiltX - currentRotation.x) * 0.05;

            lightboxCard.style.transform = `rotateX(${currentRotation.x}deg) rotateY(${currentRotation.y}deg)`;
        }
    }
    spinAnimationId = requestAnimationFrame(spinLoop);
}

lightboxCard.addEventListener('mousedown', function(e) {
    e.preventDefault();
    isDragging = true;
    isSpinning = false;
    hasDragged = false;
    previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', function(e) {
    if (isDragging) {
        const deltaMove = {
            x: e.clientX - previousMousePosition.x,
            y: e.clientY - previousMousePosition.y
        };
        
        if (Math.abs(deltaMove.x) > 2 || Math.abs(deltaMove.y) > 2) {
            hasDragged = true;
        }

        currentRotation.y += deltaMove.x * 0.5;
        currentRotation.x -= deltaMove.y * 0.5;
        
        lightboxCard.style.transform = `rotateX(${currentRotation.x}deg) rotateY(${currentRotation.y}deg)`;
        
        previousMousePosition = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', function() {
    if (isDragging) {
        isDragging = false;
        isSpinning = true;
        lastTime = performance.now();
    }
});

function closeLightboxFn() {
    lightbox.classList.remove('active');
    isSpinning = false;
    isDragging = false;
    hasDragged = false;
    lightboxCard.style.transform = '';
    currentRotation = { x: 0, y: 0 };
}

closeLightbox.addEventListener('click', closeLightboxFn);

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && lightbox.classList.contains('active')) {
        closeLightboxFn();
    }
});

lightbox.addEventListener('click', function(e) {
    if (e.target === lightbox && !hasDragged) {
        closeLightboxFn();
    }
    setTimeout(() => { hasDragged = false; }, 100);
});

copyShareBtn.addEventListener('click', function () {
    generateShareLink();
    if (!shareLinkInput.value) {
        showToast('Список пуст');
        return;
    }
    shareLinkInput.select();
    document.execCommand('copy');
    showToast('Ссылка скопирована!');
});

window.addEventListener('hashchange', loadFromHash);

spinAnimationId = requestAnimationFrame(spinLoop);

initDatabase();
</script>
</body>
</html>
